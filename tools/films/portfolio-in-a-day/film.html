<svg id="sv" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

      <stop offset="0" stop-color="#ffffff"/><stop offset=".65" stop-color="#fbfaf6"/><stop offset="1" stop-color="#eeebe2"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b2a6b" flood-opacity=".18"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>

<script>
const Q=new URLSearchParams(location.search);
const L=Q.get('l')||'h';
const W=L==='h'?1920:1080, H=L==='h'?1080:1920;
const NS='http://www.w3.org/2000/svg';
const NAVY='#1b2a6b', ORANGE='#ff6a1a', SOFT='#5a6aa8', PAPER='#fbf7ee';
const sv=document.getElementById('sv'); sv.setAttribute('width',W); sv.setAttribute('height',H); sv.setAttribute('viewBox',`0 0 ${W} ${H}`);
const bg=document.getElementById('bg'); bg.setAttribute('width',W); bg.setAttribute('height',H);
const world=document.getElementById('world'), penLayer=document.getElementById('pen');
const P=(h,v)=>L==='h'?h:v;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
// seeded rng
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function jit(a){return (rnd()-.5)*2*a;}
// ---------- hand-drawn path helpers ----------
function line(x1,y1,x2,y2,j=3){const mx=(x1+x2)/2+jit(j),my=(y1+y2)/2+jit(j);return `M${x1+jit(j/2)},${y1+jit(j/2)} Q${mx},${my} ${x2+jit(j/2)},${y2+jit(j/2)}`;}
function rrect(x,y,w,h,j=4){ // one continuous rough rectangle, slight overshoot
  const p=[[x+jit(j),y+jit(j)],[x+w+jit(j),y+jit(j)],[x+w+jit(j),y+h+jit(j)],[x+jit(j),y+h+jit(j)],[x+jit(j)+6,y+jit(j)-2]];
  let d=`M${p[0][0]},${p[0][1]}`;for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i];d+=` Q${(a[0]+b[0])/2+jit(j)},${(a[1]+b[1])/2+jit(j)} ${b[0]},${b[1]}`;}return d;}
function ellipse(cx,cy,rx,ry,j=.04,turn=1.08){let d='';const n=40;for(let i=0;i<=n*turn;i++){const a=-Math.PI/2+i/n*Math.PI*2;const r=1+jit(j);d+=(i?' L':'M')+(cx+Math.cos(a)*rx*r).toFixed(1)+','+(cy+Math.sin(a)*ry*r).toFixed(1);}return d;}
function arrowD(x1,y1,x2,y2,bend=40){const mx=(x1+x2)/2,my=(y1+y2)/2;const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy);const nx=-dy/l,ny=dx/l;const cx=mx+nx*bend,cy=my+ny*bend;
  const a=Math.atan2(y2-cy,x2-cx);const h=28;
  return `M${x1},${y1} Q${cx},${cy} ${x2},${y2} M${x2-h*Math.cos(a-.45)},${y2-h*Math.sin(a-.45)} L${x2},${y2} L${x2-h*Math.cos(a+.45)},${y2-h*Math.sin(a+.45)}`;}
function tickD(x,y,s=1){return `M${x},${y} L${x+18*s},${y+22*s} L${x+56*s},${y-30*s}`;}
// ---------- timeline ----------
const ORDER=['hook','sand','steps','bring','get','proof','sky'];
const GAP=0.62, START0=0.35;
const SC={};let tcur=START0;
ORDER.forEach((id,i)=>{const w=WORDS[id];SC[id]={id,i,start:tcur,words:w,end:tcur+w[w.length-1][1]+w[w.length-1][2]};tcur=SC[id].end+GAP;});
const SPEECH_END=SC.sky.end;
const ZOOM_AT=SPEECH_END+1.0, ZOOM_DUR=2.4, TOTAL=ZOOM_AT+ZOOM_DUR+2.2;
window.FILM={W,H,TOTAL,scenes:ORDER.map(id=>({id,start:SC[id].start})),events:[]};
// grid placement: snake 4x2
const GX=W+160, GY=H+160;
const CELL=L==='h'?[[0,0],[1,0],[2,0],[3,0],[3,1],[2,1],[1,1],[0,1]]:[[0,0],[1,0],[2,0],[3,0],[3,1],[2,1],[1,1],[0,1]];
function cellOrigin(i){return [CELL[i][0]*GX,CELL[i][1]*GY];}
// ---------- element registry ----------
const ITEMS=[]; // {t0,t1,update(t), pen?:{tip(p)->[x,y] local}, scene, color}
let S=null, lastEnd=0;
function scene(id){S=SC[id];const [ox,oy]=cellOrigin(S.i);S.ox=ox;S.oy=oy;S.g=el('g',{transform:`translate(${ox},${oy})`},world);S.back=el('g',{},S.g);S.front=el('g',{},S.g);lastEnd=S.start+0.08;return S;}
function w(word,occ=1){let n=0;for(const x of S.words){if(x[0]===word&&++n===occ)return S.start+x[1];}throw new Error('word '+word+' '+occ+' in '+S.id);}
function wEnd(word,occ=1){let n=0;for(const x of S.words){if(x[0]===word&&++n===occ)return S.start+x[1]+x[2];}throw new Error('word '+word);}
function slot(t0,dur){ // sequence pen work within a scene
  if(t0<lastEnd+0.04)t0=lastEnd+0.04; lastEnd=t0+dur; return [t0,t0+dur];}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOut=x=>1-Math.pow(1-x,3);
let clipN=0;
// write text
function write(txt,x,y,o={}){
  const size=o.size||64,color=o.color||NAVY;
  const par=o.parent||S.front;
  const t=el('text',{x,y,'font-size':size,'font-weight':o.bold?700:400,fill:color,'text-anchor':o.anchor||'start'},par);
  t.textContent=txt;
  if(o.rot)t.setAttribute('transform',`rotate(${o.rot} ${x} ${y})`);
  const bb=t.getBBox();
  const id='c'+(clipN++);const cp=el('clipPath',{id,clipPathUnits:'userSpaceOnUse'},par);
  const r=el('rect',{x:bb.x-12,y:bb.y-30,height:bb.height+60,width:0},cp);
  t.setAttribute('clip-path',`url(#${id})`);
  const dur=o.dur||clamp(txt.length*0.055,0.32,1.5);
  const item={t0:o.t,t1:o.t+dur,color,kind:'write',node:t,bb,
    update(tt){const p=clamp((tt-item.t0)/(item.t1-item.t0),0,1);r.setAttribute('width',p>=1?bb.width+40:(bb.width+12)*p);},
    tip(p){const x=bb.x+bb.width*p;const yy=bb.y+bb.height*0.58+Math.sin(p*bb.width/size*11)*size*0.16;return [x,yy];}};
  if(o.rot){ // rotate tip about (x,y)
    const a=o.rot*Math.PI/180;item.tip=(p)=>{const px=bb.x+bb.width*p,py=bb.y+bb.height*.58+Math.sin(p*bb.width/size*11)*size*.16;const dx=px-x,dy=py-y;return [x+dx*Math.cos(a)-dy*Math.sin(a),y+dx*Math.sin(a)+dy*Math.cos(a)];};}
  push(item);return item;}
// draw path
function draw(d,o={}){
  const par=o.back?S.back:(o.parent||S.front);
  const color=o.color||NAVY;
  const p=el('path',{d,fill:o.fill||'none','fill-opacity':0,stroke:color,'stroke-width':o.width||6,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1},par);
  if(o.opacity)p.setAttribute('opacity',o.opacity);
  if(o.dash)p.dataset.dash=o.dash;
  const len=p.getTotalLength();
  const dur=o.dur||clamp(len/900,0.25,1.6);
  const fo=o.fillOpacity??1;
  const item={t0:o.t,t1:o.t+dur,color,kind:'draw',node:p,len,
    update(tt){const q=clamp((tt-item.t0)/(item.t1-item.t0),0,1);p.setAttribute('stroke-dashoffset',1-q);
      if(o.fill){p.setAttribute('fill-opacity',clamp((tt-item.t1)/0.35,0,1)*fo);}},
    tip(q){const pt=p.getPointAtLength(q*len);return [pt.x,pt.y];}};
  if(o.nopen)item.nopen=true;
  if(o.xf)item.xf=o.xf; // local->scene transform fn for pen
  push(item);return item;}
// fade/pop (no pen)
function pop(node,t,dur=.35,o={}){const item={t0:t,t1:t+dur,nopen:true,update(tt){const q=clamp((tt-t)/dur,0,1);node.setAttribute('opacity',o.to!==undefined?1+(o.to-1)*easeOut(q):easeOut(q));}};node.setAttribute('opacity',o.to!==undefined?1:0);push(item);return item;}
function custom(t0,t1,fn){push({t0,t1,nopen:true,update:fn,always:true});}
function push(it){it.scene=S;ITEMS.push(it);}
function hl(x1,y,x2,o={}){return draw(`M${x1},${y} Q${(x1+x2)/2},${y+jit(4)} ${x2},${y+jit(3)}`,{back:true,color:o.color||ORANGE,width:o.width||34,opacity:o.opacity||.35,t:o.t,dur:o.dur||.45,free:o.free});}
function underline(item,o={}){const b=item.bb;return draw(`M${b.x-6},${b.y+b.height*0.92} Q${b.x+b.width/2},${b.y+b.height*0.98+jit(5)} ${b.x+b.width+10},${b.y+b.height*0.9}`,{color:o.color||ORANGE,width:o.width||8,t:o.t,dur:o.dur||.35});}
function strike(item,o={}){const b=item.bb;return draw(`M${b.x-14},${b.y+b.height*.6} L${b.x+b.width+14},${b.y+b.height*.45}`,{color:o.color||ORANGE,width:o.width||9,t:o.t,dur:o.dur||.3});}
function tickAfter(item,o={}){const b=item.bb;return draw(tickD(b.x+b.width+30,b.y+b.height*.55,o.s||1),{color:o.color||ORANGE,width:9,t:o.t,dur:.3});}
// Pip the pebble: returns group whose position can be animated
function pip(x,y,o={}){const s=o.s||1;const g=el('g',{transform:`translate(${x},${y}) scale(${s})`},S.front);
  const body=draw('M-58,18 C-62,-30 -22,-52 8,-50 C44,-48 64,-22 60,14 C56,40 26,50 -4,50 C-36,50 -56,40 -58,18 Z',{parent:g,t:o.t,dur:.7,fill:'#e9e4f2',width:5,xf:pt=>xfg(g,pt)});
  const blaze=draw('M-14,-30 C-4,-36 16,-36 26,-28',{parent:g,color:ORANGE,width:12,t:o.t,dur:.2,xf:pt=>xfg(g,pt)});
  const eyes=el('g',{},g);el('circle',{cx:-14,cy:0,r:6,fill:NAVY},eyes);el('circle',{cx:16,cy:0,r:6,fill:NAVY},eyes);
  const sm=el('path',{d:'M-10,18 Q2,28 14,18',fill:'none',stroke:NAVY,'stroke-width':4,'stroke-linecap':'round'},eyes);
  push({nopen:true,t0:0,t1:0,update(tt){eyes.setAttribute('opacity',clamp((tt-blaze.t1)/.2,0,1));}});
  return {g,x,y,s,body};}
function xfg(g,pt){const m=g.transform.baseVal.consolidate();if(!m)return pt;const M=m.matrix;return [M.a*pt[0]+M.c*pt[1]+M.e,M.b*pt[0]+M.d*pt[1]+M.f];}
// polaroid photo
function photo(href,x,y,w,o={}){
  const ar=o.ar||0.625;const ph=w*ar;const hh=ph+(o.cap?64:24);
  const g=el('g',{transform:`rotate(${o.rot||0} ${x+w/2} ${y+hh/2})`},S.front);
  const card=el('rect',{x:x-12,y:y-12,width:w+24,height:hh+12,fill:'#fff',filter:'url(#shadow)'},g);
  const im=el('image',{href,x,y,width:w,height:ph,preserveAspectRatio:'xMidYMin slice'},g);
  const frame=draw(rrect(x-12,y-12,w+24,hh+12,3),{parent:g,width:4,t:o.t,dur:.55,xf:pt=>xfg(g,pt)});
  card.setAttribute('opacity',0);
  push({t0:0,t1:0,nopen:true,update(tt){const q=clamp((tt-frame.t0-.15)/.5,0,1);card.setAttribute('opacity',q);im.setAttribute('opacity',clamp((tt-frame.t0-.3)/.45,0,1));}});
  im.setAttribute('opacity',0);
  // tape
  const tp=el('rect',{x:x+w/2-50,y:y-30,width:100,height:34,fill:ORANGE,opacity:0,transform:`rotate(${jit(6)} ${x+w/2} ${y-13})`},g);
  push({t0:0,t1:0,nopen:true,update(tt){tp.setAttribute('opacity',.55*clamp((tt-frame.t1-.05)/.2,0,1));}});
  let cap=null;
  if(o.cap){cap=write(o.cap,x+w/2,y+ph+50,{size:o.capSize||38,anchor:'middle',t:frame.t1-.05,parent:g,dur:o.capDur});cap.xf=pt=>xfg(g,pt);}
  return {g,frame,cap,x,y,w,ph,hh};}

function build(){

{const big=write('3 hours',P(170,540),P(330,300),{size:P(200,190),bold:1,anchor:P('start','middle'),t:0.04,dur:.85});

 draw(rrect(bx+130,by+20,bw-260,42,2),{t:w('address'),dur:.18,width:4,color:SOFT});

 draw(ellipse(bx+bw-95,by+41,11,11,.05),{t:w('internet'),dur:.12,width:5,color:ORANGE,fill:ORANGE});
 write('live',bx+bw-76,by+52,{size:32,bold:1,color:ORANGE,t:w('internet'),dur:.25});

 underline({bb:{x:hi.bb.x+hi.bb.width*0.62,y:hi.bb.y,width:hi.bb.width*0.34,height:hi.bb.height}},{t:w('name')+.1});

 // step 5 lines at their words

// ================= CAMERA + PEN =================
function camAt(t){ // returns [cx,cy,z]
  const ids=ORDER;let k=0;for(let i=0;i<ids.length;i++){if(t>=SC[ids[i]].start-0.62)k=i;}
  const center=i=>{const [ox,oy]=cellOrigin(i);return [ox+W/2,oy+H/2];};
  let [cx,cy]=center(k);let z=1;
  const st=SC[ids[k]].start-0.62;
  if(k>0&&t<st+0.62){const q=ease(clamp((t-st)/0.62,0,1));const [px,py]=center(k-1);cx=px+(cx-px)*q;cy=py+(cy-py)*q;z=1-0.1*Math.sin(Math.PI*q);}
  // final zoom out to the whole board
  if(t>ZOOM_AT&&L==='v'){const q=ease(clamp((t-ZOOM_AT)/ZOOM_DUR,0,1));const [ex,ey]=center(7);cx=cx+(ex-cx)*q;cy=cy+(ey-cy)*q;z=1-0.62*Math.sin(Math.PI*q);}
  else if(t>ZOOM_AT){const q=ease(clamp((t-ZOOM_AT)/ZOOM_DUR,0,1));
    const bw=3*GX+W,bh=GY+H;const fz=Math.min(W/(bw+240),H/(bh+240));
    const fx=bw/2,fy=bh/2;cx=cx+(fx-cx)*q;cy=cy+(fy-cy)*q;z=1+(fz-1)*q;}
  return [cx,cy,z];}

function penPose(t,cam){
  const pens=ITEMS.filter(i=>!i.nopen&&i.tip).sort((a,b)=>a.t0-b.t0);
  let act=null,prev=null,next=null;
  for(const it of pens){if(t>=it.t0&&t<=it.t1){act=it;}if(it.t1<t)prev=(!prev||it.t1>prev.t1)?it:prev;if(it.t0>t&&(!next||it.t0<next.t0))next=it;}
  const tipOf=(it,p)=>{let pt=it.tip(p);if(it.xf)pt=it.xf(pt);return toScreen(it.scene,pt,cam);};
  const REST=[W+80,H+260];
  if(act){const p=clamp((t-act.t0)/(act.t1-act.t0),0,1);return {pt:tipOf(act,p),color:act.color,lift:0};}
  if(prev&&next){const g=next.t0-prev.t1;const a=tipOf(prev,1),b=tipOf(next,0);const q=(t-prev.t1)/g;
    if(g<0.9){const e=ease(q);return {pt:[a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e-Math.sin(Math.PI*q)*30],color:next.color,lift:Math.sin(Math.PI*q)};}
    const out=Math.min(.35,g/3);const tt=t-prev.t1;
    if(tt<out){const e=ease(tt/out);return {pt:[a[0]+(REST[0]-a[0])*e,a[1]+(REST[1]-a[1])*e],color:prev.color,lift:1};}
    if(t>next.t0-out){const e=ease(1-(next.t0-t)/out);return {pt:[REST[0]+(b[0]-REST[0])*e,REST[1]+(b[1]-REST[1])*e],color:next.color,lift:1};}
    return {pt:REST,color:next.color,lift:1};}
  if(prev){const tt=t-prev.t1;const a=tipOf(prev,1);const e=ease(clamp(tt/.4,0,1));return {pt:[a[0]+(REST[0]-a[0])*e,a[1]+(REST[1]-a[1])*e],color:prev.color,lift:1};}
  if(next){const b=tipOf(next,0);const e=ease(clamp(1-(next.t0-t)/.4,0,1));return {pt:[REST[0]+(b[0]-REST[0])*e,REST[1]+(b[1]-REST[1])*e],color:next.color,lift:1};}
  return {pt:REST,color:NAVY,lift:1};}
// ================= RENDER =================
function render(t){
  const cam=camAt(t);
  world.setAttribute('transform',`translate(${W/2},${H/2}) scale(${cam[2]}) translate(${-cam[0]},${-cam[1]})`);
  for(const it of ITEMS){
    if(it.always||true)it.update(t);
  }
  const ps=penPose(t,cam);
  const s=L==='h'?1:1.15;
  pen.setAttribute('transform',`translate(${ps.pt[0]},${ps.pt[1]}) scale(${s*(1+.04*ps.lift)})`);
  shadowG.setAttribute('transform',`translate(${14+18*ps.lift},${16+18*ps.lift})`);
  band.setAttribute('fill',ps.color);cap.setAttribute('fill',ps.color);tipEl.setAttribute('fill',ps.color);
  const z=t>ZOOM_AT?clamp(1-(t-ZOOM_AT)/.5,0,1):1;pen.setAttribute('opacity',z);
}
